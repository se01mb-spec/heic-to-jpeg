name: Build ARJSOFT HEIC Converter

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare branded assets
        run: python prepare_assets.py

      - name: Build portable application
        run: |
          pyinstaller --noconfirm --clean --windowed --name ARJSOFT-HEIC-Converter --icon assets/arjsoft-icon.ico --collect-all pillow_heif --add-data "assets/arjsoft-logo.png;assets" main.py

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        run: |
          & "C:\\Program Files (x86)\\Inno Setup 6\\ISCC.exe" installer.iss

      - name: Upload portable app and installer
        uses: actions/upload-artifact@v4
        with:
          name: ARJSOFT-HEIC-Converter-Windows
          path: |
            dist/ARJSOFT-HEIC-Converter/
            dist/ARJSOFT-HEIC-Converter-Setup.exe
          if-no-files-found: error
